# Mirrors entries from ~/.ssh/config so they're browsable inside yazi.
# Open from shell: `yazi sftp://thebox`
# Open from yazi:  `:` then `cd sftp://thebox`

# Home machine (LAN)
[sftp.thebox]
host = "192.168.1.104"
user = "will"
port = 1993
key_file = "/home/wgb/.ssh/id_ed25519"

# Home machine (over the internet)
[sftp.remotebox]
host = "brookesyarchibox.duckdns.org"
user = "will"
port = 1993
key_file = "/home/wgb/.ssh/id_ed25519"
